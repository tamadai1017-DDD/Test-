<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R448A CoolProp 粘度計算</title>
<style>
body{font-family:system-ui,sans-serif;background:#f5f7fa;margin:0;padding:18px;color:#17202a}
main{max-width:980px;margin:auto}.card{background:white;padding:14px;margin:12px 0;border-radius:12px}
.notice{padding:12px;border-radius:10px;background:#fff3cd}.ok{background:#d1e7dd}.err{background:#f8d7da}
button{padding:11px 14px;margin:4px;border:0;border-radius:9px;background:#1261a0;color:white;font-size:1rem}
button:disabled{opacity:.45}table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{border:1px solid #d8dee4;padding:6px;text-align:right}th{background:#eaf2f8}th:first-child,td:first-child{text-align:center}
.scroll{overflow:auto}code{word-break:break-all}
</style>
</head>
<body><main>
<h1>R448A CoolProp 8.0.0 粘度計算</h1>
<div id="status" class="notice">CoolPropを読み込み中…</div>
<div class="card">
<button id="run" disabled>-40～+50℃ 19点を計算</button>
<button id="csv" disabled>CSV保存</button>
<p>必要ファイル：index.html / coolprop.js / coolprop.wasm を同じ階層に配置してください。</p>
</div>
<div class="card"><b>25℃ Honeywell照合</b><div id="check">未計算</div></div>
<div class="card scroll"><table><thead><tr><th>℃</th><th>蒸気 μPa·s</th><th>液 μPa·s</th><th>状態</th></tr></thead><tbody id="body"></tbody></table></div>
<script type="module">
const status=document.getElementById('status'), run=document.getElementById('run'), csv=document.getElementById('csv'), body=document.getElementById('body'), check=document.getElementById('check');
let CP, fluid='', rows=[];
async function start(){
 try{
   const mod=await import('./coolprop.js');
   CP=await mod.default({locateFile:(path)=> path.endsWith('.wasm') ? './coolprop.wasm' : './'+path});
   for(const f of ['R448A.mix','R448A']){
     try{const x=CP.PropsSI('VISCOSITY','T',298.15,'Q',1,f);if(Number.isFinite(x)){fluid=f;break}}catch(e){}
   }
   if(!fluid) throw new Error('R448Aの計算を開始できませんでした');
   status.className='notice ok';status.innerHTML='読込成功：<b>'+fluid+'</b>';run.disabled=false;
 }catch(e){
   status.className='notice err';
   status.innerHTML='読込失敗：'+e.message+'<br><small>GitHubのリポジトリ直下に index.html / coolprop.js / coolprop.wasm の3ファイルがあるか確認してください。</small>';
 }
}
function one(c){
 try{
   const T=c+273.15;
   return {c,v:CP.PropsSI('VISCOSITY','T',T,'Q',1,fluid)*1e6,l:CP.PropsSI('VISCOSITY','T',T,'Q',0,fluid)*1e6,s:'OK'};
 }catch(e){return {c,s:e.message}}
}
run.onclick=()=>{
 rows=[];for(let c=-40;c<=50;c+=5)rows.push(one(c));
 body.innerHTML=rows.map(r=>`<tr><td>${r.c}</td><td>${r.v?.toFixed(3)??''}</td><td>${r.l?.toFixed(3)??''}</td><td>${r.s}</td></tr>`).join('');
 const p=rows.find(x=>x.c===25);
 if(p?.s==='OK'){
   const dv=(p.v-12.5)/12.5*100, dl=(p.l-138.1)/138.1*100;
   check.innerHTML=`CoolProp 蒸気 ${p.v.toFixed(3)}（差 ${dv.toFixed(2)}%）／液 ${p.l.toFixed(3)}（差 ${dl.toFixed(2)}%）`;
 }
 csv.disabled=false;
};
csv.onclick=()=>{
 let s='Temp_C,Vapor_viscosity_uPa_s,Liquid_viscosity_uPa_s,Status\n'+rows.map(r=>`${r.c},${r.v??''},${r.l??''},"${r.s}"`).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='R448A_viscosity_19points.csv';a.click();
};
start();
</script>
</main></body></html>
